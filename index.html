    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        :root {
            --bg-main: #0a0a0a;
            --card-inner: #161616;
            --accent: #00d2ff;
            --text-white: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .contact-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-inner);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-top: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            height: 120px;
            position: relative;
        }

        .profile-img-container {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #161616;
            padding: 5px;
            border: 4px solid #161616;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-img i {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .card-body {
            padding: 65px 25px 30px;
            text-align: center;
        }

        .card-body h1 { 
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem; 
            margin-bottom: 5px; 
            font-weight: 700; 
        }

        .card-body .title { 
            font-family: 'Lato', sans-serif;
            color: var(--accent); 
            font-size: 0.85rem; 
            font-weight: 400; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
        }

        .save-btn {
            background: var(--text-white);
            color: #000;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            transition: transform 0.2s;
        }

        .save-btn:active { transform: scale(0.95); }

        .info-list { text-align: left; margin-bottom: 30px; }

        .info-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .info-item i { width: 40px; color: var(--accent); font-size: 1.1rem; }

        .info-content p { font-size: 0.7rem; color: var(--text-muted); margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .info-content span { font-size: 0.95rem; font-weight: 400; color: var(--text-white); }

        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        .social-box {
            background: #222;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            color: #fff;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
        }

        .social-box:hover { background: #282828; }
    </style>
</head>

  <body>
    <div id="root"></div>

    <div class="contact-card">
        <div class="card-header">
            <div class="profile-img-container">
                <div class="profile-img">
                    <i class="fas fa-fingerprint"></i>
                </div>
            </div>
        </div>

        <div class="card-body">
            <h1>2D Creation</h1>
            <p class="title">Precision. Partnership. Performance.</p>

            <a href="https://wa.me/919994104442?text=Hi%202D%20Creation!%20Save%20this%20contact." class="save-btn">
                <i class="fas fa-user-plus"></i> SAVE CONTACT
            </a>

            <div class="info-list">
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <div class="info-content">
                        <p>Mobile</p>
                        <span>+91 99941 04442</span>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <div class="info-content">
                        <p>Email</p>
                        <span>hello@2dcreation.in</span>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-globe"></i>
                    <div class="info-content">
                        <p>Website</p>
                        <span>www.2dcreation.in</span>
                    </div>
                </div>
            </div>

            <div class="social-grid">
                <a href="https://wa.me/919994104442" class="social-box">
                    <i class="fab fa-whatsapp" style="color:#25D366;"></i>
                </a>
                <a href="https://www.instagram.com/domine_mens_clothing/" class="social-box">
                    <i class="fab fa-instagram" style="color:#E1306C;"></i>
                </a>
                <a href="https://www.facebook.com/people/Domine-Mens-Clothing/61580278718458/" class="social-box">
                    <i class="fab fa-facebook" style="color:#1877F2;"></i>
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
