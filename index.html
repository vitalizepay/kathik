<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik | Digital Contact Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #0a0a0a;
            --card-bg: #141414;
            --accent: #0077b5; /* LinkedIn Blue */
            --text-white: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header-gradient {
            background: linear-gradient(135deg, #0077b5 0%, #00a0dc 100%);
            height: 100px;
            position: relative;
        }

        .avatar-container {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 5px solid var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .avatar i {
            font-size: 3rem;
            color: var(--accent);
        }

        .card-content {
            padding: 65px 25px 35px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .action-list {
            text-align: left;
            margin-bottom: 30px;
        }

        .action-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            text-decoration: none;
            color: var(--text-white);
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .action-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .action-item i {
            width: 40px;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .info-box span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .info-box p {
            font-size: 1rem;
            font-weight: 400;
        }

        .save-button {
            display: block;
            background: var(--text-white);
            color: #000;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .save-button:active {
            transform: scale(0.96);
        }

        .footer-logo {
            margin-top: 30px;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="header-gradient">
            <div class="avatar-container">
                <div class="avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>
        </div>

        <div class="card-content">
            <h1>Karthik</h1>
            <p class="subtitle">2D Creation</p>

            <div class="action-list">
                <a href="tel:+919791881884" class="action-item">
                    <i class="fas fa-phone-alt"></i>
                    <div class="info-box">
                        <span>Call me</span>
                        <p>+91 97918 81884</p>
                    </div>
                </a>

                <a href="https://wa.me/919791881884" class="action-item">
                    <i class="fab fa-whatsapp"></i>
                    <div class="info-box">
                        <span>Message</span>
                        <p>WhatsApp</p>
                    </div>
                </a>

                <a href="https://www.linkedin.com/in/karthick-subramaniamm/" target="_blank" class="action-item">
                    <i class="fab fa-linkedin-in"></i>
                    <div class="info-box">
                        <span>LinkedIn</span>
                        <p>Karthick Subramaniam</p>
                    </div>
                </a>
            </div>

            <a href="tel:+919791881884" class="save-button">
                ADD TO CONTACTS
            </a>

            <div class="footer-logo">
                2DCREATION.IN
            </div>
        </div>
    </div>

</body>
</html>
